<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Type — Business Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0f1117;
    color: #e2e8f0;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
  }

  /* HEADER */
  .header {
    margin-bottom: 2rem;
  }
  .header h1 {
    font-size: clamp(1.4rem, 3vw, 2rem);
    font-weight: 700;
    color: #f1f5f9;
    margin-bottom: 0.5rem;
    letter-spacing: -0.02em;
  }
  .header .subtitle {
    color: #64748b;
    font-size: 0.875rem;
    margin-bottom: 0.75rem;
    line-height: 1.5;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: #1e2130;
    border: 1px solid #2d3448;
    color: #4f8ef7;
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.3rem 0.75rem;
    border-radius: 999px;
    letter-spacing: 0.02em;
  }
  .badge::before {
    content: '';
    display: inline-block;
    width: 7px;
    height: 7px;
    background: #4f8ef7;
    border-radius: 50%;
  }

  /* CARDS */
  .card {
    background: #1e2130;
    border: 1px solid #2d3448;
    border-radius: 12px;
    padding: 1.5rem;
  }

  /* KPI GRID */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1rem;
    margin-bottom: 1.5rem;
  }
  @media (max-width: 900px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) { .kpi-grid { grid-template-columns: 1fr; } }

  .kpi-card {
    background: #1e2130;
    border: 1px solid #2d3448;
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    position: relative;
    overflow: hidden;
  }
  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: 12px 12px 0 0;
  }
  .kpi-card:nth-child(1)::before { background: #4f8ef7; }
  .kpi-card:nth-child(2)::before { background: #22c55e; }
  .kpi-card:nth-child(3)::before { background: #f59e0b; }
  .kpi-card:nth-child(4)::before { background: #818cf8; }

  .kpi-label {
    font-size: 0.75rem;
    font-weight: 600;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .kpi-value {
    font-size: clamp(1.5rem, 3vw, 2rem);
    font-weight: 700;
    color: #f1f5f9;
    line-height: 1.2;
  }
  .kpi-card:nth-child(1) .kpi-value { color: #4f8ef7; }
  .kpi-card:nth-child(2) .kpi-value { color: #22c55e; }
  .kpi-card:nth-child(3) .kpi-value { color: #f59e0b; }
  .kpi-card:nth-child(4) .kpi-value { color: #818cf8; }
  .kpi-sub {
    font-size: 0.75rem;
    color: #475569;
  }

  /* CHARTS ROW */
  .charts-row {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }
  @media (max-width: 750px) { .charts-row { grid-template-columns: 1fr; } }

  .chart-card {
    background: #1e2130;
    border: 1px solid #2d3448;
    border-radius: 12px;
    padding: 1.5rem;
  }
  .chart-title {
    font-size: 0.85rem;
    font-weight: 600;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin-bottom: 1.25rem;
  }
  .chart-container {
    height: 280px;
    position: relative;
  }

  /* INSIGHTS GRID */
  .section-title {
    font-size: 0.85rem;
    font-weight: 600;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin-bottom: 1rem;
  }
  .insights-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1rem;
    margin-bottom: 1.5rem;
  }
  @media (max-width: 620px) { .insights-grid { grid-template-columns: 1fr; } }

  .insight-card {
    background: #1e2130;
    border: 1px solid #2d3448;
    border-radius: 12px;
    padding: 1.25rem 1.25rem 1.25rem 1.5rem;
    border-left-width: 4px;
    border-left-style: solid;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .insight-card:nth-child(1) { border-left-color: #4f8ef7; }
  .insight-card:nth-child(2) { border-left-color: #22c55e; }
  .insight-card:nth-child(3) { border-left-color: #f59e0b; }
  .insight-card:nth-child(4) { border-left-color: #ef4444; }

  .insight-title {
    font-size: 0.875rem;
    font-weight: 700;
    color: #f1f5f9;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .insight-body {
    font-size: 0.8rem;
    color: #94a3b8;
    line-height: 1.6;
  }

  /* HYPOTHESIS TABLE */
  .table-section {
    margin-bottom: 1.5rem;
  }
  .table-wrapper {
    background: #1e2130;
    border: 1px solid #2d3448;
    border-radius: 12px;
    overflow: hidden;
  }
  .table-scroll {
    max-height: 420px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #2d3448 transparent;
  }
  .table-scroll::-webkit-scrollbar { width: 6px; }
  .table-scroll::-webkit-scrollbar-track { background: transparent; }
  .table-scroll::-webkit-scrollbar-thumb { background: #2d3448; border-radius: 3px; }

  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead {
    position: sticky;
    top: 0;
    z-index: 1;
    background: #161825;
  }
  thead th {
    padding: 0.75rem 1rem;
    text-align: left;
    font-size: 0.7rem;
    font-weight: 700;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    border-bottom: 1px solid #2d3448;
    white-space: nowrap;
  }
  tbody tr {
    transition: background 0.15s;
  }
  tbody tr:nth-child(even) { background: #181c2c; }
  tbody tr:hover { background: #222840; }
  tbody td {
    padding: 0.75rem 1rem;
    font-size: 0.78rem;
    color: #94a3b8;
    border-bottom: 1px solid #1a1f32;
    vertical-align: top;
    line-height: 1.5;
  }
  tbody tr:last-child td { border-bottom: none; }
  .td-id {
    color: #4f8ef7;
    font-weight: 700;
    white-space: nowrap;
    min-width: 40px;
  }
  .td-statement { min-width: 220px; max-width: 320px; }
  .td-insight { min-width: 200px; max-width: 300px; }

  .verdict-badge {
    display: inline-block;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .verdict-true { background: rgba(34,197,94,0.15); color: #22c55e; border: 1px solid rgba(34,197,94,0.3); }
  .verdict-false { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
  .verdict-inconclusive { background: rgba(100,116,139,0.2); color: #94a3b8; border: 1px solid rgba(100,116,139,0.3); }

  /* CAT BREAKDOWN */
  .cat-section {
    margin-bottom: 1.5rem;
  }

  /* FOOTER */
  .footer {
    text-align: center;
    padding: 1.5rem 0 0.5rem;
    border-top: 1px solid #2d3448;
    color: #475569;
    font-size: 0.75rem;
    line-height: 1.8;
  }
  .footer strong { color: #64748b; }
</style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <div class="header">
    <h1 id="dash-title"></h1>
    <p class="subtitle" id="dash-subtitle"></p>
    <span class="badge" id="dash-badge"></span>
  </div>

  <!-- KPI CARDS -->
  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-label">Total Records</div>
      <div class="kpi-value" id="kpi-total"></div>
      <div class="kpi-sub">Analyzed events</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Model Accuracy</div>
      <div class="kpi-value" id="kpi-accuracy"></div>
      <div class="kpi-sub" id="kpi-accuracy-sub"></div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Avg Confidence</div>
      <div class="kpi-value" id="kpi-conf"></div>
      <div class="kpi-sub">Prediction confidence</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">True Hypotheses</div>
      <div class="kpi-value" id="kpi-hyp"></div>
      <div class="kpi-sub" id="kpi-hyp-sub"></div>
    </div>
  </div>

  <!-- CHARTS ROW -->
  <div class="charts-row">
    <div class="chart-card">
      <div class="chart-title">Prediction Distribution</div>
      <div class="chart-container">
        <canvas id="doughnutChart"></canvas>
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Feature Importance</div>
      <div class="chart-container">
        <canvas id="barChart"></canvas>
      </div>
    </div>
  </div>

  <!-- BUSINESS INSIGHTS -->
  <div class="section-title">Business Insights</div>
  <div class="insights-grid" id="insights-grid"></div>

  <!-- HYPOTHESIS TABLE -->
  <div class="table-section">
    <div class="section-title">Hypothesis Validation</div>
    <div class="table-wrapper">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Verdict</th>
              <th>Hypothesis</th>
              <th>Business Insight</th>
            </tr>
          </thead>
          <tbody id="hyp-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- CATEGORY BREAKDOWN (conditional) -->
  <div class="cat-section" id="cat-section" style="display:none;">
    <div class="section-title" id="cat-title"></div>
    <div class="chart-card">
      <div class="chart-container" style="height:320px;">
        <canvas id="catChart"></canvas>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <strong>Generated by Auto Data Scientist v7 · CrewAI + Claude 4.6 Sonnet</strong><br>
    <span id="gen-time"></span>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
const DATA = {
  "title": "Event Type \u2014 Business Dashboard",
  "context": "# business_context.txt\necho \"E-commerce platform with 285M user events. Goal: predict whether a user \nwill purchase a product based on their browsing behavior (view, cart, purchase). \nKey business questions: which products to recommend, which users are likely to \nconvert, and which product categories drive the most revenue.\"",
  "model_name": "XGBoost",
  "metric_label": "Accuracy",
  "metric_value": 97.02,
  "total_rows": 2000000,
  "avg_conf": 97.0,
  "pred_dist": {
    "view": 2000000
  },
  "feat_imp": {
    "feat_interact": 0.37959998846054077,
    "price": 0.22750000655651093,
    "price_zscore_abs": 0.1738000065088272,
    "price_product_log_interact": 0.1234000027179718,
    "feat_product": 0.08389999717473984,
    "user_price_ratio": 0.011800000444054604,
    "log_price": 0.0
  },
  "hypotheses": [
    {"id":"H1","verdict":"FALSE","statement":"Users with higher 'price' products in their sessions tend to have lower purchase event_type rates, a","insight":"Price alone does not deter purchases, and mid-to-high priced products may attract more intent-driven shoppers, suggestin"},
    {"id":"H2","verdict":"FALSE","statement":"Users with higher 'feat_ratio' (engineered feature) tend to have higher purchase event_type rates, s","insight":"Users with lower feat_ratio values are actually stronger purchase intent signals, meaning the feature should be inverted"},
    {"id":"H3","verdict":"FALSE","statement":"Users with higher 'feat_sum' values tend to have higher purchase event_type rates, as aggregated fea","insight":"Mid-range engaged users (Q2) are the most likely to purchase, suggesting that very high feature interaction may indicate"},
    {"id":"H4","verdict":"FALSE","statement":"Sessions/Events with extreme 'price_zscore_abs' (far from mean price) tend to have lower purchase ev","insight":"Unusually priced items do not systematically deter purchases, suggesting customers may be motivated by both bargains and"},
    {"id":"H5","verdict":"INCONCLUSIVE","statement":"Events associated with specific 'brand' values tend to have significantly different purchase event_t","insight":"Oral-b and tyrex show the highest conversion rates among displayed brands, suggesting focused marketing investment in th"},
    {"id":"H6","verdict":"TRUE","statement":"Events from specific 'category_code' values tend to have higher purchase event_type rates, as certai","insight":"The business should prioritize marketing spend and inventory optimization for high-converting categories like headphones"},
    {"id":"H7","verdict":"FALSE","statement":"Users with higher 'user_price_ratio' tend to have higher purchase event_type rates, indicating that ","insight":"Price-to-user-budget alignment does not appear to be a meaningful driver of purchase conversion, suggesting the business"},
    {"id":"H8","verdict":"FALSE","statement":"Events with higher 'log_price' values tend to have lower purchase event_type rates, as logarithmical","insight":"Price alone does not linearly drive conversion behavior, suggesting other factors like product category, brand perceptio"},
    {"id":"H9","verdict":"FALSE","statement":"Events with higher 'feat_interact' values tend to have higher purchase event_type rates, suggesting ","insight":"Lower feat_interact values are actually stronger predictors of purchase intent, so the model or targeting strategy shoul"},
    {"id":"H10","verdict":"FALSE","statement":"Users with higher 'price_per_product_magnitude' tend to have lower purchase event_type rates, as pro","insight":"Outlier pricing relative to product magnitude does not discourage purchases, suggesting customers may actually be drawn "}
  ],
  "insights": [
    {"title":"Model Predicts Buyers With 97% Accuracy","body":"Our XGBoost model correctly identifies whether a user will view, add to cart, or purchase with 97% accuracy across 2 million analyzed events. This level of precision means marketing and merchandising decisions can now be driven by predictive data rather than gut instinct, reducing wasted spend and missed revenue opportunities."},
    {"title":"Price Is the #1 Purchase Driver","body":"Across all behavioral signals, price and price-related features dominate the model as the strongest predictors of whether a user converts. This tells us customers are highly price-sensitive, and targeted pricing strategies or timely discounts could meaningfully lift conversion rates for users showing high purchase intent."},
    {"title":"Category Selection Unlocks Hidden Revenue","body":"Validated data confirms that specific product categories generate disproportionately higher purchase rates than others. Doubling down on inventory, promotions, and recommendation placement within these high-converting categories represents one of the fastest paths to incremental revenue growth."},
    {"title":"Interaction Behavior Signals Buying Intent","body":"User interaction patterns, captured in our top-ranked engagement feature, are a powerful early indicator of purchase likelihood before a user ever reaches the cart. By identifying these behavioral signals in real time, we can trigger personalized recommendations or incentives at exactly the right moment to close the sale."}
  ],
  "cat_breakdown": {},
  "true_hyp_count": 1,
  "false_hyp_count": 8,
  "inc_hyp_count": 1
};

// ─── CHART DEFAULTS ───────────────────────────────────────────────────────────
Chart.defaults.color = '#94a3b8';
Chart.defaults.font.family = 'Inter, sans-serif';
Chart.defaults.font.size = 12;

// ─── HEADER ───────────────────────────────────────────────────────────────────
document.getElementById('dash-title').textContent = DATA.title;

const rawCtx = DATA.context.replace(/\n/g, ' ').replace(/^#[^\n]*\n?/, '').replace(/echo\s+"?/, '').replace(/"$/, '').trim();
const subtitle = rawCtx.length > 120 ? rawCtx.slice(0, 117) + '…' : rawCtx;
document.getElementById('dash-subtitle').textContent = subtitle;
document.getElementById('dash-badge').textContent = `${DATA.model_name} · ${DATA.metric_label} ${DATA.metric_value}%`;

// ─── KPI CARDS ────────────────────────────────────────────────────────────────
document.getElementById('kpi-total').textContent = DATA.total_rows.toLocaleString();
document.getElementById('kpi-accuracy').textContent = DATA.metric_value + '%';
document.getElementById('kpi-accuracy-sub').textContent = DATA.metric_label + ' score';
document.getElementById('kpi-conf').textContent = DATA.avg_conf != null ? DATA.avg_conf + '%' : 'N/A';
const totalHyp = DATA.true_hyp_count + DATA.false_hyp_count + DATA.inc_hyp_count;
document.getElementById('kpi-hyp').textContent = `${DATA.true_hyp_count}/${totalHyp}`;
document.getElementById('kpi-hyp-sub').textContent = `${DATA.false_hyp_count} false · ${DATA.inc_hyp_count} inconclusive`;

// ─── DOUGHNUT CHART ──────────────────────────────────────────────────────────
(function() {
  const labels = Object.keys(DATA.pred_dist);
  const values = Object.values(DATA.pred_dist);

  const palette = [
    '#22c55e','#ef4444','#4f8ef7','#f59e0b','#818cf8',
    '#06b6d4','#ec4899','#a3e635','#fb923c','#e879f9'
  ];

  const colors = labels.map((lbl, i) => {
    const l = lbl.toLowerCase();
    if (l === '0' || l === 'on time' || l === 'view') return '#4f8ef7';
    if (l === '1' || l === 'late' || l === 'purchase') return '#22c55e';
    if (l === 'cart') return '#f59e0b';
    return palette[i % palette.length];
  });

  const ctx = document.getElementById('doughnutChart').getContext('2d');
  new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: labels,
      datasets: [{
        data: values,
        backgroundColor: colors,
        borderColor: '#1e2130',
        borderWidth: 3,
        hoverOffset: 6
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: '65%',
      plugins: {
        legend: {
          position: 'bottom',
          labels: {
            padding: 16,
            usePointStyle: true,
            pointStyleWidth: 10,
            font: { size: 12 },
            color: '#94a3b8'
          }
        },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              const total = ctx.dataset.data.reduce((a, b) => a + b, 0);
              const pct = ((ctx.parsed / total) * 100).toFixed(1);
              return ` ${ctx.label}: ${ctx.parsed.toLocaleString()} (${pct}%)`;
            }
          }
        }
      }
    }
  });
})();

// ─── FEATURE IMPORTANCE BAR ──────────────────────────────────────────────────
(function() {
  const entries = Object.entries(DATA.feat_imp)
    .sort((a, b) => b[1] - a[1]);

  const labels = entries.map(e => e[0]);
  const values = entries.map(e => e[1]);

  const ctx = document.getElementById('barChart').getContext('2d');

  const grad = ctx.createLinearGradient(0, 0, 400, 0);
  grad.addColorStop(0, '#4f8ef7');
  grad.addColorStop(1, '#818cf8');

  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: 'Importance Score',
        data: values,
        backgroundColor: grad,
        borderRadius: 5,
        borderSkipped: false,
        barThickness: 18
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => ` ${ctx.parsed.x.toFixed(4)}`
          }
        }
      },
      scales: {
        x: {
          title: {
            display: true,
            text: 'Importance Score',
            color: '#64748b',
            font: { size: 11 }
          },
          grid: { color: '#2d3448' },
          ticks: { color: '#64748b' }
        },
        y: {
          grid: { display: false },
          ticks: {
            color: '#94a3b8',
            font: { size: 11 }
          }
        }
      }
    }
  });
})();

// ─── INSIGHTS GRID ───────────────────────────────────────────────────────────
(function() {
  const icons = ['📊', '🎯', '⚡', '💡'];
  const grid = document.getElementById('insights-grid');
  DATA.insights.forEach((ins, i) => {
    const card = document.createElement('div');
    card.className = 'insight-card';
    card.innerHTML = `
      <div class="insight-title">${icons[i % icons.length]} ${ins.title}</div>
      <div class="insight-body">${ins.body}</div>
    `;
    grid.appendChild(card);
  });
})();

// ─── HYPOTHESIS TABLE ────────────────────────────────────────────────────────
(function() {
  const tbody = document.getElementById('hyp-tbody');
  DATA.hypotheses.forEach(h => {
    const tr = document.createElement('tr');
    const verdictClass = h.verdict === 'TRUE'
      ? 'verdict-true'
      : h.verdict === 'FALSE'
      ? 'verdict-false'
      : 'verdict-inconclusive';

    tr.innerHTML = `
      <td class="td-id">${h.id}</td>
      <td><span class="verdict-badge ${verdictClass}">${h.verdict}</span></td>
      <td class="td-statement">${h.statement}</td>
      <td class="td-insight">${h.insight}</td>
    `;
    tbody.appendChild(tr);
  });
})();

// ─── CATEGORY BREAKDOWN ──────────────────────────────────────────────────────
(function() {
  if (!DATA.cat_breakdown || !DATA.cat_breakdown.column || !DATA.cat_breakdown.data) return;
  const section = document.getElementById('cat-section');
  section.style.display = 'block';
  document.getElementById('cat-title').textContent = 'Late Rate by ' + DATA.cat_breakdown.column;

  const catData = DATA.cat_breakdown.data;
  const labels = Object.keys(catData);
  const values = Object.values(catData).map(v => parseFloat((v * 100).toFixed(2)));

  const ctx = document.getElementById('catChart').getContext('2d');
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: 'Late Rate (%)',
        data: values,
        backgroundColor: '#4f8ef7',
        borderRadius: 5,
        borderSkipped: false
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => ` ${ctx.parsed.y.toFixed(2)}%`
          }
        }
      },
      scales: {
        y: {
          min: 0,
          max: 100,
          ticks: {
            color: '#64748b',
            callback: v => v + '%'
          },
          grid: { color: '#2d3448' }
        },
        x: {
          ticks: { color: '#94a3b8' },
          grid: { display: false }
        }
      }
    }
  });
})();

// ─── FOOTER TIMESTAMP ────────────────────────────────────────────────────────
